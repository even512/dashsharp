name: Build & Publish Docker image

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  # Syntax, Modulmanifeste und die Kern-Endpunkte pruefen, BEVOR ein Image
  # gebaut und veroeffentlicht wird. app.js und server.js sind grosse
  # Einzeldateien: ein Syntaxfehler liefert ein weisses Dashboard, ohne dass
  # der Build fehlschlaegt — das faellt sonst erst dem Benutzer auf.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Smoke-Test
        run: npm test

  # Das Image wirklich bauen und starten, bevor es veroeffentlicht wird. Der
  # Smoke-Test oben laeuft gegen das Repo — eine Datei, die zur Laufzeit
  # gebraucht, aber nicht ins Image kopiert wird, faellt dort nicht auf. Genau
  # daran ist der Container schon einmal gestorben (server/ fehlte im COPY).
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (nur laden, nicht pushen)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dashsharp:ci
          provenance: false

      - name: Container starten und pruefen
        run: |
          set -euo pipefail
          # Frisches Volume mit fremder Kennung — bildet eine bestehende
          # Unraid-Installation (nobody:users) nach.
          mkdir -p "$RUNNER_TEMP/appdata"
          sudo chown 99:100 "$RUNNER_TEMP/appdata"
          docker run -d --name dashsharp-ci -p 8099:3000 \
            -v "$RUNNER_TEMP/appdata:/app/config" dashsharp:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs dashsharp-ci
          if [ "${ok:-0}" != "1" ]; then echo "::error::Container nicht erreichbar"; exit 1; fi

          curl -fsS http://127.0.0.1:8099/api/version | grep -q '"version"'
          curl -fsS http://127.0.0.1:8099/registry.js  >/dev/null
          curl -fsS http://127.0.0.1:8099/modules.js   >/dev/null
          curl -fsS http://127.0.0.1:8099/vendor/fonts/jetbrains-mono-400-latin.woff2 >/dev/null

          # Schreibpfad: die UI muss ins gemountete Volume speichern koennen.
          curl -fsS -X POST http://127.0.0.1:8099/api/dashboard \
            -H 'Content-Type: application/json' \
            -d '{"pages":[{"id":"home","name":"CI"}],"tiles":[]}' | grep -q '"ok":true'
          test -f "$RUNNER_TEMP/appdata/dashboard.json"

          # Rechte tatsaechlich abgelegt?
          docker exec dashsharp-ci sh -c 'id -u' | grep -qv '^0$' \
            || echo "::warning::Container laeuft als root"
          docker rm -f dashsharp-ci

  docker:
    needs: [test, image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dashsharp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
